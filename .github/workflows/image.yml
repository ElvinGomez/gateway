# Builds the production image for the self-hosted platform and publishes it to GHCR.
# Tags: <sha> and the channel (main | qa | dev). On main, triggers the Dokploy deploy webhook.
# Plan: docs/plans/2026-11-20-vps-self-hosting-migration (root repo).
name: image

on:
  push:
    branches: [main, qa, feat/self-hosting]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name and channel
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          case "${GITHUB_REF_NAME}" in main) channel=main ;; qa) channel=qa ;; *) channel=dev ;; esac
          echo "image=ghcr.io/${owner}/tripsi-gateway" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy on Dokploy (main only)
        if: github.ref_name == 'main'
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: '[ -z "$HOOK" ] || curl -fsS -X POST "$HOOK"'
